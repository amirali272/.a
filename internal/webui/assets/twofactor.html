<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15120c">
  <link rel="manifest" href="__BASE_PATH__/manifest.json">
  <link rel="icon" href="__BASE_PATH__/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="__BASE_PATH__/icon.svg">
  <title>Backpack · Login</title>
  <style>
    :root {
      --bg-1: #15120c;
      --bg-2: #1f1a11;
      --canvas: #241f15;
      --canvas-2: #2b2418;
      --stitch: rgba(233, 215, 180, .16);
      --stitch-strong: rgba(233, 215, 180, .28);
      --accent-rgb: 255, 69, 58;
      --accent: rgb(var(--accent-rgb));
      --accent-soft: color-mix(in srgb, var(--accent) 55%, #f2e6cf);
      --accent-deep: color-mix(in srgb, var(--accent) 55%, #120800);
      --txt: #f3ecdd;
      --muted: #a99a80;
      --dim: #6f6552;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      background:
        radial-gradient(1100px 700px at 14% -10%, rgba(255, 255, 255, .05), transparent 60%),
        radial-gradient(900px 620px at 100% 110%, rgba(0, 0, 0, .5), transparent 55%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--txt);
      display: grid;
      place-items: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .05;
      mix-blend-mode: overlay;
      background-image:
        repeating-linear-gradient(45deg, #fff 0 1px, transparent 1px 6px),
        repeating-linear-gradient(-45deg, #fff 0 1px, transparent 1px 6px);
    }

    .ic {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px
    }

    .tag {
      position: relative;
      z-index: 1;
      width: min(92vw, 372px);
      animation: rise .7s cubic-bezier(.16, 1, .3, 1) both
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98)
      }
    }

    .panel {
      position: relative;
      background: linear-gradient(180deg, var(--canvas-2), var(--canvas));
      border: 1px solid rgba(0, 0, 0, .4);
      border-radius: var(--radius);
      box-shadow: 0 30px 70px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .05);
      padding: 40px 32px 28px;
      text-align: center;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: calc(var(--radius) - 8px);
      border: 1.5px dashed var(--stitch);
      pointer-events: none;
    }

    .rivet {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e8d9b8, #7a6c4c 70%);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .6)
    }

    .rivet.tl {
      top: 18px;
      left: 18px
    }

    .rivet.br {
      bottom: 18px;
      right: 18px
    }

    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(150deg, var(--accent), var(--accent-deep));
      box-shadow: 0 8px 22px rgba(var(--accent-rgb), .4), inset 0 1px 0 rgba(255, 255, 255, .35);
    }

    .mark .ic {
      width: 26px;
      height: 26px
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      font-style: italic;
      letter-spacing: -.01em;
      line-height: 1.1
    }

    .sub {
      color: var(--muted);
      font-size: 12.5px;
      margin: 8px 0 28px;
      line-height: 1.5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .field {
      position: relative;
      display: flex;
      align-items: center
    }

    .field-label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: -8px;
      background: var(--canvas);
      padding: 0 6px;
      font-size: 10px;
      letter-spacing: .06em;
      color: var(--dim);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    input {
      width: 100%;
      padding: 17px 18px 15px;
      font-size: 22px;
      letter-spacing: .5em;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--txt);
      background: rgba(0, 0, 0, .22);
      border: 1px solid rgba(233, 215, 180, .14);
      border-radius: 12px;
      outline: none;
      transition: border-color .25s, box-shadow .25s, background .25s;
      font-variant-numeric: tabular-nums;
    }

    input::placeholder {
      letter-spacing: .36em;
      color: var(--dim)
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .16);
      background: rgba(0, 0, 0, .3)
    }

    button[type=submit] {
      margin-top: 6px;
      min-height: 50px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .02em;
      background: linear-gradient(150deg, var(--accent), var(--accent-deep));
      border: none;
      border-radius: 12px;
      transition: transform .22s, box-shadow .22s;
      box-shadow: 0 10px 24px rgba(var(--accent-rgb), .32);
      touch-action: manipulation;
    }

    button[type=submit]:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 32px rgba(var(--accent-rgb), .46)
    }

    button[type=submit]:active {
      transform: translateY(0) scale(.99)
    }

    .hintline {
      margin-top: 18px;
      color: var(--dim);
      font-size: 11.5px;
      line-height: 1.6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .foot {
      margin-top: 22px;
      text-align: center;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: .02em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .foot b {
      color: var(--accent-soft);
      font-weight: 600
    }

    .foot.bp-attrib {
      opacity: .6;
      font-size: 10.5px;
      margin-top: 5px;
      line-height: 1.5
    }

    .foot.bp-attrib a {
      color: inherit
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="tag">
    <div class="panel">
      <span class="rivet tl" aria-hidden="true"></span>
      <span class="rivet br" aria-hidden="true"></span>
      <div class="mark" aria-hidden="true">
        <svg class="ic" viewBox="0 0 24 24">
          <rect x="4" y="10" width="16" height="10" rx="2" />
          <path d="M8 10V7a4 4 0 018 0v3" />
          <path d="M12 14v2" />
        </svg>
      </div>
      <h1>Backpack</h1>
      <div class="sub" id="sub">enter the code from your authenticator app</div>
      <form method="post" action="__BASE_PATH__/login">
        <div class="field">
          <label class="field-label" for="code" id="codelabel">code</label>
          <input id="code" name="code" type="text" maxlength="24" placeholder="000000" autofocus
            autocomplete="one-time-code" inputmode="numeric" required>
        </div>
        <button type="submit" id="unlock">Verify</button>
      </form>
      <div class="hintline" id="hint">Lost the phone? A recovery code works here too.</div>
    </div>
    <div class="foot">TeleGram <b>@BlackProtocols</b> · GitHub <b>AminMGMT</b></div>
    <!-- The Appropriate Legal Notice AGPL-3.0 section 13 asks a network
         service to show the people interacting with it, and the attribution
         NOTICE requires a modified version to keep. -->
    <div class="foot bp-attrib">Based on BackPack by Amin Mohammadi (AminMGMT)<br>
      <a href="https://github.com/AminMGMT/BackPack" rel="noreferrer">source</a> · AGPL-3.0
    </div>
  </div>
  <script nonce="__CSP_NONCE__">
    // The accent chosen in the panel applies here too, for the same reason it
    // does on the password page: a second step in a different colour reads as a
    // different product, which is exactly the wrong feeling on a login.
    (function () {
      const A = {
        ember: '255,69,58', pomegranate: '231,29,54', saffron: '247,181,56',
        pistachio: '127,184,0', turquoise: '65,187,217', frost: '173,202,214'
      };
      try {
        const v = A[localStorage.getItem('bp_accent')];
        if (v) document.documentElement.style.setProperty('--accent-rgb', v);
      } catch (e) { }
    })();
  </script>
  <script nonce="__CSP_NONCE__">
    (function () {
      if (localStorage.getItem('bp_lang') !== 'fa') return;
      document.documentElement.lang = 'fa';
      document.documentElement.dir = 'rtl';
      const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
      set('sub', 'کدی که اپلیکیشن authenticator نشان می‌دهد را وارد کن');
      set('codelabel', 'کد دو مرحله‌ای');
      set('unlock', 'تأیید');
      set('hint', 'گوشی را از دست داده‌ای؟ یکی از کدهای بازیابی هم اینجا کار می‌کند.');
      const c = document.getElementById('code');
      if (c) { c.style.direction = 'ltr'; c.style.textAlign = 'center'; }
    })();
  </script>
</body>

</html>
